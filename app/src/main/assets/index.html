<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEBASHY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfd8dd;--ink:#1b2530;--panel:#f1f5f7;--accent:#d62839;--btn:#25303b;--btnink:#f1f5f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--ink:#e6edf1;--panel:#18212a;--btn:#e6edf1;--btnink:#0e1419}}
:root[data-theme="dark"]{--bg:#0e1419;--ink:#e6edf1;--panel:#18212a;--btn:#e6edf1;--btnink:#0e1419}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:1.05rem;gap:12px}
#msg{font-weight:500;flex:1;text-align:center;font-size:.95rem;min-height:1.5em}
#wrap{width:100%;max-width:900px;padding:0 12px;position:relative}
canvas{width:100%;display:block;border-radius:12px;background:#e3ebee;border:3px solid var(--ink);box-shadow:0 10px 25px rgba(0,0,0,.18)}
#pad{display:flex;justify-content:space-between;width:100%;max-width:900px;padding:14px 16px;gap:12px;direction:ltr}
#pad div{display:flex;gap:12px}
#pad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--btn);color:var(--btnink);font-size:2rem;font-family:inherit;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.2)}
#pad button:active{transform:scale(.94)}
#ov{position:absolute;inset:0 12px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(14,20,25,.82);color:#fff;border-radius:12px;font-size:1.6rem;font-weight:800;text-align:center;backdrop-filter:blur(4px)}
#ov button{font:inherit;font-size:1.1rem;padding:8px 22px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
small{opacity:.7;padding:0 16px 10px;text-align:center}
#lbb,#mt{font:inherit;font-size:.85rem;padding:4px 12px;border:0;border-radius:8px;background:var(--btn);color:var(--btnink);cursor:pointer}
#lobby{position:absolute;inset:0 12px;display:none;flex-direction:column;align-items:center;gap:8px;padding:14px 12px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;overflow:auto}
#lobby h2{margin:0;font-size:2.2rem;letter-spacing:.18em;color:var(--accent)}
#lobby p{margin:0;font-weight:800}
#pl{font:inherit;font-size:1.1rem;padding:8px 26px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#gr{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;direction:ltr}
#gr button{font:inherit;font-size:.8rem;padding:5px 0;border:2px solid transparent;border-radius:6px;background:var(--btn);color:var(--btnink);cursor:pointer}
#gr button:disabled{opacity:.3;cursor:default}
#gr button.cu{border-color:var(--accent)}
#nx{position:absolute;inset:0 12px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(14,20,25,.88);color:#fff;border-radius:12px;font-size:1.7rem;font-weight:800;text-align:center;backdrop-filter:blur(4px)}
#nx button{font:inherit;font-size:1.2rem;padding:10px 32px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><span id="lv">المرحلة 1</span><span id="msg"></span><span id="dt">😈 0</span><button id="mt">🔊</button><button id="lbb">HEBASHY ☰</button></header>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas>
<div id="ov"><div id="ovt"></div><button id="rs">العب تاني</button></div>
<div id="nx"><div id="nxt"></div><button id="nb">التالي ▶</button></div>
<div id="lobby"><h2>HEBASHY</h2><p id="lp"></p><button id="pl">كمّل اللعب</button><div id="gr"></div></div></div>
<div id="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><button id="bj">▲</button></div>
<small>الأسهم أو A/D للحركة، مسافة أو ↑ للنط. مفيش حاجة زي ما هي باينة.</small>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const K={},T={l:0,r:0,j:0};
addEventListener('keydown',e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const b=$(id);
b.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=1});
['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>T[k]=0));
b.addEventListener('contextmenu',e=>e.preventDefault())});

const P=(x,y,w,h,o={})=>({k:'p',x,y,w,h,vis:true,act:true,...o});
const S=(x,y,w,o={})=>({k:'s',x,y,w,h:16,vis:true,act:true,...o});
const B=(x,y,w,h,o={})=>({k:'b',x,y,w,h,vis:true,act:true,...o});
const D=(x,y,o={})=>({k:'d',x,y,w:22,h:32,vis:true,act:true,...o});
const hid=(a,b,d)=>({vis:false,act:false,trig:[a,b],do:d});
const G=()=>P(0,320,640,40);

const TAUNT=['ضحكتك دي قريبة ✋','كنت متوقع كده 😈','قلتلك متثقش.','جرب تاني، هتنجح!','الفخ ده بقى مشهور.','أوب! حصل حاجة؟','الأرض كانت بتكدب.'];

let lvl=0,deaths=0,E=[],p,state='play',cur,parts=[],shake=0;

function spawnPart(x,y,col,cnt=8,spd=3,grav=0.15,sz=3){
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2,v=Math.random()*spd+0.5;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,col,life:1,dec:0.025+Math.random()*0.02,grav,sz:sz*(0.6+Math.random()*0.8)});
  }
}

function load(){
  cur=gen(lvl);E=cur.e;parts=[];shake=0;
  p={x:cur.s[0],y:cur.s[1],vx:0,vy:0,w:14,h:20,on:false,f:1,sx:1,sy:1,walk:0,blink:0};
  state='play';
  $('lv').textContent='المرحلة '+(lvl+1)+' / 100';
  $('msg').textContent=cur.m;
  $('dt').textContent='😈 '+deaths;
}

const hit=(a,b,s=0)=>a.x<b.x+b.w-s&&a.x+a.w>b.x+s&&a.y<b.y+b.h-s&&a.y+a.h>b.y+s;

function fire(e){
  const d=e.do||{};e.fired=true;
  if(d.show){e.vis=e.act=true;spawnPart(e.x+e.w/2,e.y+e.h/2,'#ffffff',6,2,0.05,2.5);}
  if(d.vanish){
    if(d.dl)e.dc=d.dl;
    else{e.vis=e.act=false;spawnPart(e.x+e.w/2,e.y+e.h/2,'#cbd5e1',10,2.5,0.2,3);}
  }
  if(d.tp){
    spawnPart(e.x+e.w/2,e.y+e.h/2,'#f2a900',12,3,0,3);
    e.x=d.tp[0];e.y=d.tp[1];
    spawnPart(e.x+e.w/2,e.y+e.h/2,'#f2a900',12,3,0,3);
  }
  if(d.vx||d.vy)e.mv=true;
}

function die(){
  if(state!=='play')return;
  sfx(110,.35,'sawtooth');
  state='dead';deaths++;shake=10;
  spawnPart(p.x+p.w/2,p.y+p.h/2,'#d62839',22,5,0.22,4);
  spawnPart(p.x+p.w/2,p.y+p.h/2,'#ffd166',10,3.5,0.18,3);
  $('dt').textContent='😈 '+deaths;
  $('msg').textContent=TAUNT[Math.floor(Math.random()*TAUNT.length)];
  setTimeout(()=>{if(state==='dead')load()},800);
}

function step(){
  if(shake>0)shake*=0.85;
  for(let i=parts.length-1;i>=0;i--){
    const pt=parts[i];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=pt.grav;pt.life-=pt.dec;
    if(pt.life<=0)parts.splice(i,1);
  }

  if(state!=='play')return;
  const wasOn=p.on;
  const L=T.l||K.ArrowLeft||K.KeyA,R=T.r||K.ArrowRight||K.KeyD,J=T.j||K.ArrowUp||K.Space||K.KeyW;
  p.vx=((R?1:0)-(L?1:0))*3.1;
  if(p.vx){
    p.f=p.vx>0?1:-1;
    if(p.on){
      p.walk+=0.32;
      if(Math.floor(p.walk)%4===0 && Math.random()<0.35) spawnPart(p.x+p.w/2,p.y+p.h,'rgba(255,255,255,0.7)',1,1,-0.02,2);
    }
  }else{
    p.walk=0;
  }

  if(J&&p.on){
    p.vy=-9.3;p.on=false;
    p.sx=0.72;p.sy=1.32;
    spawnPart(p.x+p.w/2,p.y+p.h,'#ffffff',6,2,0.05,2.5);
    sfx(320,.08,'sine');
  }

  p.vy=Math.min(p.vy+.5,10);
  const sol=()=>E.filter(e=>e.k==='p'&&e.act);
  p.x+=p.vx;
  for(const e of sol())if(hit(p,e)){if(p.vx>0)p.x=e.x-p.w;else if(p.vx<0)p.x=e.x+e.w}
  p.y+=p.vy;p.on=false;
  for(const e of sol())if(hit(p,e)){
    if(p.vy>0){
      p.y=e.y-p.h;
      if(!wasOn && p.vy>2){
        p.sx=1.3;p.sy=0.72;
        spawnPart(p.x+p.w/2,p.y+p.h,'#ffffff',5,1.8,0.05,2);
      }
      p.vy=0;p.on=true;
      if(e.trig==='touch'&&!e.fired)fire(e);
    }
    else if(p.vy<0){p.y=e.y+e.h;p.vy=0}
  }

  p.sx+=(1-p.sx)*0.22;
  p.sy+=(1-p.sy)*0.22;

  if(p.blink>0)p.blink--;
  else if(Math.random()<0.008)p.blink=7;

  p.x=Math.max(0,Math.min(640-p.w,p.x));
  for(const e of E){
    if(!e.fired&&Array.isArray(e.trig)&&p.x>=e.trig[0]&&p.x<=e.trig[1]&&(!e.ty||p.y>=e.ty[0]&&p.y<=e.ty[1]))fire(e);
    if(e.osc){e.ph=(e.ph||0)+e.osc[2];const q=Math.sin(e.ph)*e.osc[1];if(e.osc[0]==='x')e.x=e.ox+q;else e.y=e.oy+q}
    if(e.dc>0&&--e.dc===0){e.vis=e.act=false;spawnPart(e.x+e.w/2,e.y+e.h/2,'#cbd5e1',10,2.5,0.2,3);}
    if(e.mv){e.x+=e.do.vx||0;e.y+=e.do.vy||0}
    if((e.k==='s'||e.k==='b')&&e.act&&hit(p,e,3)){die();return}
  }
  if(p.y>380){die();return}
  for(const e of E)if(e.k==='d'&&hit(p,e)){
    lvl++;save();sfx(660,.25,'square');
    spawnPart(e.x+e.w/2,e.y+e.h/2,'#ffd166',25,4,0.1,3.5);
    if(lvl>=100){
      state='win';
      $('ovt').innerHTML='مبروك يا HEBASHY! خلصت الـ100 مرحلة 🎉<br><small style="font-size:1rem;opacity:1">موتّ نفسك '+deaths+' مرة</small>';
      $('ov').style.display='flex';
    }else{
      state='next';
      $('nxt').innerHTML='المرحلة '+lvl+' خلصت! 🎉<br>موتات لحد دلوقتي: '+deaths;
      $('nx').style.display='flex';
    }
    return;
  }
}

function drawPlayer(){
  if(!p || state==='dead') return;
  ctx.save();
  const cx=p.x+p.w/2, by=p.y+p.h;
  ctx.translate(cx,by);
  ctx.scale(p.sx*p.f, p.sy);

  if(p.on){
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath();ctx.ellipse(0,0,8,2.5,0,0,Math.PI*2);ctx.fill();
  }

  const runSwing=p.on && Math.abs(p.vx)>0.1 ? Math.sin(p.walk)*4.5 : (p.on ? 0 : 3.5);
  const bob=p.on && Math.abs(p.vx)>0.1 ? Math.abs(Math.cos(p.walk))*1.5 : Math.sin(fr*0.08)*0.6;

  ctx.strokeStyle='#1b2530';ctx.lineWidth=2.6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-11+bob);ctx.lineTo(-runSwing*0.7,-6+bob);ctx.stroke();

  ctx.lineWidth=2.8;
  ctx.strokeStyle='#1b2530';
  ctx.beginPath();ctx.moveTo(-2,-6+bob);ctx.lineTo(-2-runSwing,-1);ctx.stroke();
  ctx.fillStyle='#d62839';ctx.fillRect(-4-runSwing,-2.5,4.5,2.5);

  ctx.beginPath();ctx.moveTo(2,-6+bob);ctx.lineTo(2+runSwing,-1);ctx.stroke();
  ctx.fillStyle='#ff4d6d';ctx.fillRect(0+runSwing,-2.5,4.5,2.5);

  ctx.fillStyle='#0b7285';
  ctx.beginPath();
  ctx.roundRect(-5.5,-13+bob,11,8.5,3);
  ctx.fill();
  ctx.strokeStyle='#1b2530';ctx.lineWidth=1.2;ctx.stroke();

  ctx.fillStyle='#ffd166';
  ctx.fillRect(-5,-6.5+bob,10,1.8);

  ctx.fillStyle='#ffcdb2';
  ctx.beginPath();
  ctx.arc(0,-17.5+bob,6.2,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#1b2530';ctx.lineWidth=1.2;ctx.stroke();

  ctx.fillStyle='#2b2d42';
  ctx.beginPath();
  ctx.arc(0,-18.5+bob,6.4,Math.PI,Math.PI*2);
  ctx.lineTo(7.5,-18.5+bob);
  ctx.lineTo(-6.4,-18.5+bob);
  ctx.fill();
  ctx.fillStyle='#d62839';
  ctx.fillRect(-5.5,-19.8+bob,11,1.6);

  if(p.blink>0){
    ctx.strokeStyle='#1b2530';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(1.5,-16.5+bob);ctx.lineTo(4.5,-16.5+bob);ctx.stroke();
  }else{
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(3,-16.5+bob,2.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1b2530';
    ctx.beginPath();ctx.arc(3.6,-16.5+bob,1.1,0,Math.PI*2);ctx.fill();
  }

  ctx.strokeStyle='#ffcdb2';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(0,-11+bob);ctx.lineTo(runSwing*0.8,-6+bob);ctx.stroke();

  ctx.restore();
}

function draw(){
  ctx.save();
  if(shake>0.4){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }
  ctx.clearRect(0,0,640,360);
  const th=thm(lvl);
  const gd=ctx.createLinearGradient(0,0,0,360);
  gd.addColorStop(0,th[0]);gd.addColorStop(1,th[1]);
  ctx.fillStyle=gd;ctx.fillRect(0,0,640,360);

  ctx.fillStyle=th[5];ctx.globalAlpha=.16;
  for(let i=0;i<14;i++){
    const x=(i*97+fr*(.25+i%3*.15))%700-30,y=(i*53)%300+10;
    ctx.beginPath();ctx.arc(x,y,6+i%4*5,0,Math.PI*2);ctx.fill();
  }

  ctx.globalAlpha=.14;
  for(let i=0;i<7;i++){
    const x=i*130-((fr*.3)%130);
    ctx.beginPath();ctx.moveTo(x,320);ctx.lineTo(x+65,185-i%3*30);ctx.lineTo(x+130,320);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.fillStyle='rgba(27,37,48,.04)';
  for(let i=0;i<640;i+=40)ctx.fillRect(i,0,1,360);

  for(const e of E){
    if(!e.vis)continue;
    if(e.k==='p'){
      ctx.fillStyle=th[2];
      ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,e.h,3);ctx.fill();
      ctx.fillStyle=th[3];
      ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,5,[3,3,0,0]);ctx.fill();
      if(e.trig==='touch'){
        ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(e.x+e.w*0.3,e.y+2);ctx.lineTo(e.x+e.w*0.4,e.y+8);ctx.lineTo(e.x+e.w*0.35,e.y+e.h);ctx.stroke();
      }
    }
    else if(e.k==='s'){
      for(let x=e.x;x<e.x+e.w-1;x+=10){
        ctx.fillStyle=th[4];
        ctx.beginPath();ctx.moveTo(x,e.y+e.h);ctx.lineTo(x+5,e.y);ctx.lineTo(x+5,e.y+e.h);ctx.fill();
        ctx.fillStyle='#ffffff';ctx.globalAlpha=0.35;
        ctx.beginPath();ctx.moveTo(x+5,e.y+e.h);ctx.lineTo(x+5,e.y);ctx.lineTo(x+10,e.y+e.h);ctx.fill();
        ctx.globalAlpha=1;
        ctx.fillStyle=th[4];
        ctx.beginPath();ctx.moveTo(x+5,e.y+e.h);ctx.lineTo(x+5,e.y);ctx.lineTo(x+10,e.y+e.h);ctx.fill();
      }
    }
    else if(e.k==='b'){
      if(e.kn){
        ctx.fillStyle='#e8eef2';
        ctx.beginPath();ctx.moveTo(e.x+1,e.y+10);ctx.lineTo(e.x+e.w-1,e.y+10);ctx.lineTo(e.x+e.w/2,e.y+e.h);ctx.fill();
        ctx.fillStyle='#b0bec5';
        ctx.beginPath();ctx.moveTo(e.x+e.w/2,e.y+10);ctx.lineTo(e.x+e.w-1,e.y+10);ctx.lineTo(e.x+e.w/2,e.y+e.h);ctx.fill();
        ctx.fillStyle='#5a3b22';ctx.fillRect(e.x+2,e.y,e.w-4,10);
        ctx.fillStyle='#ffd166';ctx.fillRect(e.x,e.y+8,e.w,3);
      }
      else if(e.saw){
        const cx=e.x+11,cy=e.y+11,a=fr*.32;
        ctx.fillStyle='#94a3b8';
        ctx.beginPath();
        for(let i=0;i<16;i++){const r=i%2?7:12.5,t=a+i*Math.PI/8;ctx.lineTo(cx+Math.cos(t)*r,cy+Math.sin(t)*r)}
        ctx.fill();
        ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(cx,cy,6.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#d62839';ctx.beginPath();ctx.arc(cx,cy,2.8,0,Math.PI*2);ctx.fill();
      }
      else{
        ctx.fillStyle='#8f1d2a';ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,e.h,4);ctx.fill();
        ctx.fillStyle='#d62839';ctx.beginPath();ctx.roundRect(e.x+4,e.y+4,e.w-8,e.h-8,2);ctx.fill();
        ctx.fillStyle='#fff';ctx.fillRect(e.x+8,e.y+12,5,4);ctx.fillRect(e.x+e.w-13,e.y+12,5,4);
      }
    }
    else if(e.k==='d'){
      const glow=Math.sin(fr*0.1)*3;
      ctx.fillStyle='rgba(242,169,0,0.22)';
      ctx.beginPath();ctx.roundRect(e.x-3-glow/2,e.y-3-glow/2,e.w+6+glow,e.h+3+glow,6);ctx.fill();
      ctx.fillStyle='#f2a900';ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,e.h,[5,5,0,0]);ctx.fill();
      ctx.fillStyle='#1b2530';ctx.beginPath();ctx.roundRect(e.x+3,e.y+3,e.w-6,e.h-3,[3,3,0,0]);ctx.fill();
      ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(e.x+e.w-6,e.y+17,2,0,Math.PI*2);ctx.fill();
    }
  }

  for(const pt of parts){
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.col;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.sz,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  drawPlayer();
  ctx.restore();
}

let last=0,acc=0;
function loop(t){fr++;acc+=Math.min(t-last,100);last=t;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}

const MS=['كمّل، مفيش حاجة.','أمان تمامًا.','الطريق واضح.','خطوة واحدة بس.','أنا مش بكدب.','شكلها سهلة...','متقلقش يا HEBASHY.'];
function genC(n){
  let s=n*7919+13;const r=()=>(s=s*16807%2147483647)/2147483647;
  const c=Math.min(3+Math.floor(n/14),6),zw=490/c,e=[],gp=[];
  for(let i=0;i<c;i++){
    const zx=70+i*zw,sx=Math.round(zx+zw*.55);let t=Math.floor(r()*8);if(t==2&&zw<110)t=0;
    if(t==0){e.push(S(sx,304,20,hid(sx-22,sx-12,{show:1})));if(n>15)e.push(S(sx+36,304,20,hid(sx-4,sx+8,{show:1})))}
    else if(t==1)e.push(S(sx,304,20+Math.floor(r()*3)*8));
    else if(t==2){const g=Math.round(zx+10);gp.push([g,g+90]);e.push(P(g+8,320,74,12,{trig:'touch',do:{vanish:1}}))}
    else if(t==3)e.push(B(sx,-60,40,40,{trig:[sx-50,sx-40],do:{vy:9+Math.min(4,n/20)}}));
    else if(t==6)e.push(B(sx,-30,22,22,{trig:[sx-40,sx-30],do:{vy:14}}));
    else if(t==7)e.push(S(-24,304,20,{trig:[zx,zx+8],do:{vx:6+Math.min(3,n/30)}}));
    else if(t==4)e.push(S(640,304,20,{trig:[zx,zx+8],do:{vx:-(8+Math.min(6,n/15))}}));
    else e.push(S(sx,304,44),P(sx-20,258,84,12,{vis:false,act:true,trig:[sx-70,sx-60],do:{show:1}}))
  }
  let q=0;const f=[];for(const [a,b] of gp){f.push(P(q,320,a-q,40));q=b}f.push(P(q,320,640-q,40));
  e.unshift(...f);
  e.push(D(590,288,n%4==0?{trig:[540,555],do:{tp:[40,288]}}:{}));
  return{s:[30,298],m:MS[n%MS.length],e}
}

let best=0;let fr=0;

function thm(n){const h=(n*47+13)%360,c=(a,s,l)=>'hsl('+((h+a)%360)+','+s+'%,'+l+'%)';return[c(0,75,80),c(30,70,92),c(0,50,20),c(0,50,38),c(170,85,42),c(60,80,55)]}
function flip(L){const m=(x,w)=>640-x-w;L.s[0]=m(L.s[0],14);for(const e of L.e){e.x=m(e.x,e.w);if(e.ox!=null)e.ox=e.x;if(Array.isArray(e.trig))e.trig=[m(e.trig[1],14),m(e.trig[0],14)];if(e.do){if(e.do.vx)e.do.vx*=-1;if(e.do.tp)e.do.tp=[m(e.do.tp[0],22),e.do.tp[1]]}}}
function gen(n){
  let s=n*104729+7;const r=()=>(s=s*16807%2147483647)/2147483647,v=Math.min(7,2+n/12),j=k=>Math.round((r()-.5)*k),m=['الطريق واضح.','في حاجة غلط...','اطلع بسرعة!','بص فوق.','متبصش تحت.','مش هتصدق اللي جاي.','ثق فيا يا HEBASHY.'][n%7];
  const a=(n*3+Math.floor(n/7))%7;let L;
  if(a==0)L={s:[30,294],e:[P(0,320,110,40),PL(110,262,80),PL(205,204,80),CR(300,146,80),PL(395,88,100),PL(520,150,50),P(580,320,60,40),HS(228,188,208,222,[150,210]),KN(450,400,408,8+v,[30,90]),KN(480,440,448,9+v,[30,90]),SW(540,250,'y',45,.05+v/80,0),D(600,288)]};
  else if(a==1){const xs=[110,200,290,380,470],ys=[270,235+j(20),270,225+j(20),262],e=[P(0,320,90,40),P(570,320,70,40),D(600,288),KN(225,120,128,9+v,[0,360]),KN(495,390,398,10+v,[0,360]),SW(348,230,'y',40,.06+v/70,0)];
  xs.forEach((x,i)=>e.push(i==2?PL(x,ys[i],60,{osc:['y',28,.04+v/100],oy:ys[i]}):i==3?CR(x,ys[i],60):PL(x,ys[i],60)));L={s:[30,294],e}}
  else if(a==2){const e=[P(0,320,640,40),D(600,288)];[170,330,490].forEach(x=>e.push(P(x+j(20),280,30,40)));[255,415,560].forEach((x,i)=>e.push(KN(x,x-52,x-44,9+v+i,[0,360])));e.push(SW(250,200,'y',70,.05+v/60,1),SW(410,150,'y',90,.06+v/60,2));L={s:[30,298],e}}
  else if(a==3)L={s:[30,294],e:[P(0,320,100,40),S(100,304,540),PL(110,262,80),CR(200,204,80),PL(290,146,80),CR(380,88,80),PL(480,48,100),KN(310,196,204,9+v,[130,210]),HS(520,32,495,510,[0,60]),D(560,16,n%5==3?{trig:[535,550],ty:[0,60],do:{tp:[30,288]}}:{})]};
  else if(a==4)L={s:[20,40],e:[PL(0,60,90),PL(130,115,70),CR(240,170,70),PL(350,225,70),CR(460,280,70),P(570,320,70,40),S(0,304,570),D(600,288),HS(160,99,135,150,[60,115]),KN(260,235,243,9+v,[100,170]),KN(370,300,308,10+v,[150,230]),SW(540,230,'y',40,.06+v/80,0)]};
  else if(a==5){const e=[P(0,320,640,40),D(600,288),KN(380,330,338,9+v,[0,360]),HS(250,304,215,232,[0,360])];[170,310,450].forEach((x,i)=>e.push(SW(x,298,'x',55,.05+v/80+i*.01,i*2),PL(x-25,232,50)));L={s:[30,298],e}}
  else L=genC(n);
  const ex=Math.min(9,2+Math.floor(n/5));
  for(let i=0;i<ex;i++){const x=90+Math.floor(r()*440),t=r();
  if(t<.45)L.e.push(KN(x,x-50,x-42,10+v,[0,360]));

}

let NB=null;
function noise(t,d,v,hp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}

function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.22)}
const FQ=(r,s)=>r*Math.pow(2,s/12),SCL=[0,3,5,7,10,12,15,17],PG=[[0,8,3,10],[0,5,8,7]];
function step16(t,sd,w,si){const i=si%16,bar=si>>4,sec=(bar>>3)&7,I=[1,2,3,4,2,3,4,5][sec],rt=FQ(RT[w],PG[sec&1][bar&3]);
if(i==0)for(const d of [0,3,7])tone(FQ(rt,d)*2,t,sd*15,'triangle',.07);
if(I>1?i%4==0:i%8==0)kick(t);

if(i%2==0)noise(t,.03,I>3?.22:.12,7000);
if(I>4&&i==15)noise(t,.25,.3,3000);
if(i%2==0)tone(FQ(rt,[0,0,12,0,0,12,7,0][(i>>1)&7])/(I>3?1:2),t,sd*1.8,'sawtooth',.2);
if(I>3||(I>1&&i%2==0))tone(FQ(rt,[0,3,7,12,15,12,7,3][i&7])*2,t,sd*.8,'square',.1);
if(I>2&&i%2==0){const m=(bar&1)*16+i,k=(m*7+sec*3)%11;if(k<8)tone(FQ(rt,SCL[k])*4,t,sd*1.7,'sawtooth',.11)}}
